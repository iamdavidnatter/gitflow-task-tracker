<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>GitFlow Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
    <h1>GitFlow Task Tracker App</h1>

    <section class="task-form">
        <input id="taskInput" type="text" placeholder="Neue Aufgabe eingeben">
        <button id="addTaskButton">Aufgabe hinzufügen</button>
    </section>

    <p id="taskCounter">Offene Aufgaben: 0</p>

    <ul id="taskList"></ul>
</main>

<script src="script.js"></script>
</body>
</html>
